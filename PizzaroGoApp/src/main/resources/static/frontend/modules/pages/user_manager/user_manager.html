<div class="user-manager-container">
    <div class="user-header">
        <h1>User Manager</h1>
        <div class="nav-segment-container">
            <button class="nav-segment active">
                <i class="fas fa-users-gear"></i> Users
            </button>
            <button class="nav-segment" onclick="navigate('/stocks')">
                <i class="fas fa-boxes-stacked"></i> Stock
            </button>
            <button class="nav-segment" onclick="navigate('/products')">
                <i class="fas fa-pizza-slice"></i> Products
            </button>
        </div>
    </div>

    <div class="user-toolbar">
        <div class="search-container">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="user-search" placeholder="Search users..." autocomplete="off">
        </div>
    </div>

    <div class="user-table-wrapper">
        <table class="user-table">
            <thead>
                <tr>
                    <th class="sortable" data-field="id">ID <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="username">Username <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="email">Email <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="phone">Phone <i class="fas fa-sort"></i></th>
                    <th class="sortable" data-field="role">Role <i class="fas fa-sort"></i></th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="user-table-body">
                <!-- Rows will be populated by JS -->
            </tbody>
        </table>
    </div>




</div>
