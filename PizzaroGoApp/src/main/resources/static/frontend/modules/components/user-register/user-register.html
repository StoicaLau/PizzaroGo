<div class="user-register-form">
    <div id="register-message" class="message-container hidden"></div>

    <div class="form-group">
        <label for="reg-username">Username</label>
        <div class="input-wrapper">
            <input type="text" id="reg-username" placeholder="johndoe123" required />
        </div>
    </div>

    <div class="form-group">
        <label for="reg-email">Email Address</label>
        <div class="input-wrapper">
            <input type="email" id="reg-email" placeholder="name@example.com" required />
        </div>
    </div>

    <div class="form-group">
        <label for="reg-phone">Phone Number</label>
        <div class="input-wrapper">
            <input type="tel" id="reg-phone" placeholder="+1 234 567 8900" required />
        </div>
    </div>

    <div class="form-group">
        <label for="reg-password">Password</label>
        <div class="input-wrapper">
            <input type="password" id="reg-password" placeholder="Create a password" required />
        </div>
    </div>

    <button class="btn-primary" id="btn-submit-register">
        Create Account
    </button>

    <div class="form-footer">
        <span>Already have an account? </span>
        <a href="#" id="link-to-login">Log In</a>
    </div>
</div>
