<div class="auth-modal-overlay hidden" id="auth-modal">
    <div class="auth-card">
        <button class="close-btn" id="auth-close-btn">&times;</button>

        <div class="auth-header">
            <h2>Welcome Back</h2>
            <p>Please enter your details to continue</p>
        </div>

        <div class="auth-tabs">
            <button class="auth-tab active" id="tab-login">Login</button>
            <button class="auth-tab" id="tab-register">Register</button>
        </div>

        <div class="auth-content">
            <div id="view-login" class="auth-view fade-in">
                <!-- Content injected from user-login -->
                <div id="user-login-placeholder"></div>
            </div>
            <div id="view-register" class="auth-view hidden fade-in">
                <!-- Content injected from user-register -->
                <div id="user-register-placeholder"></div>
            </div>
        </div>
    </div>
</div>
